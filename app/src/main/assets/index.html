<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf8f1"><title>cookyou</title></head><body><div class="viz-dotted-background" id="pantry-demo"><div class="kitchen" aria-label="cookyou 食谱"><header><span>cookyou</span><span>slow food · good mood</span></header><main id="kitchen-content"></main><nav aria-label="主要功能"><button data-page="pantry">🥬 食材找菜</button><button data-page="search">⌕ 搜菜谱</button><button data-page="saved">♡ 收藏</button></nav></div></div>
<style>
#pantry-demo{padding:20px 10px;color-scheme:light dark}#pantry-demo .kitchen{--paper:light-dark(#fffdf7,#20251f);--ink:light-dark(#24392c,#eff3e9);--sub:light-dark(#667467,#b6c3b4);--wash:light-dark(#edf2e6,#303b2c);--line:light-dark(#dce3d4,#465242);--brand:light-dark(#31583d,#b8d6a5);--onbrand:light-dark(#ffffff,#20311d);max-width:410px;margin:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:30px;overflow:hidden;font-family:system-ui,'Microsoft YaHei',sans-serif;font-size:15px;box-shadow:0 18px 50px #00000012}#pantry-demo header{padding:23px 24px 17px;display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:1px;color:var(--sub)}#pantry-demo main{padding:6px 24px 24px;min-height:510px}#pantry-demo h1{font-size:29px;line-height:1.3;font-weight:500;margin:10px 0}#pantry-demo h2{font-size:19px;font-weight:500;margin:24px 0 12px}#pantry-demo h3{font-size:17px;font-weight:500;margin:0 0 6px}#pantry-demo p{line-height:1.7;margin:8px 0;color:var(--sub)}#pantry-demo button,#pantry-demo input,#pantry-demo select{font:inherit}#pantry-demo button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 13px;min-height:44px}#pantry-demo button:disabled{opacity:.45;cursor:default}#pantry-demo .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#pantry-demo .entry{display:flex;gap:8px;margin:20px 0 12px}#pantry-demo input{min-width:0;flex:1;width:100%;padding:13px;background:var(--wash);color:var(--ink);border:1px solid transparent;border-radius:12px;font-size:16px}#pantry-demo .primary,#pantry-demo button[aria-pressed=true]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}#pantry-demo .primary.full{width:100%;margin-top:18px}#pantry-demo .chip{border-radius:20px;padding:7px 12px;font-size:13px}#pantry-demo .muted{color:var(--sub);font-size:13px}#pantry-demo .eyebrow{font-size:12px;color:var(--brand);letter-spacing:2px;margin-top:15px}#pantry-demo .recipe{width:100%;text-align:left;display:flex;gap:14px;align-items:center;margin:11px 0;padding:14px;border-radius:17px}#pantry-demo .dish{display:grid;place-items:center;flex-shrink:0;width:66px;height:70px;border-radius:13px;background:var(--wash);font-size:34px}#pantry-demo .recipe small{display:block;color:var(--sub);font-size:12px;margin-top:6px}#pantry-demo .tag{font-size:12px;color:var(--brand)}#pantry-demo nav{display:flex;border-top:1px solid var(--line);padding:12px 14px 18px;gap:5px}#pantry-demo nav button{flex:1;border:0;background:transparent;font-size:12px;padding:10px 4px;color:var(--sub)}#pantry-demo nav button.active{color:var(--brand);background:var(--wash)}#pantry-demo .hero{padding:20px;text-align:center;background:var(--wash);border-radius:20px;margin:16px 0}#pantry-demo .hero .food{font-size:62px}#pantry-demo .ingredient{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}#pantry-demo .step{padding:18px;background:var(--wash);border-radius:18px;margin:16px 0}#pantry-demo .step p{color:var(--ink)}#pantry-demo progress{width:100%;accent-color:var(--brand)}#pantry-demo .notice{padding:12px;background:var(--wash);border-radius:12px;font-size:13px;color:var(--sub);margin-top:12px}#pantry-demo label{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px}#pantry-demo label input{flex:0 0 18px;width:18px;height:18px}#pantry-demo .back{border:0;padding-left:0;color:var(--sub)}
</style>
<script>
(()=>{const root=document.getElementById('pantry-demo'),out=root.querySelector('main');
let origin='pantry';const recipes=[{"id":1,"name":"番茄炒蛋","icon":"🍅","time":12,"desc":"酸甜开胃，第一道拿手家常菜","ingredients":[["番茄","2 个"],["鸡蛋","3 个"]],"season":"食用油 15 毫升、盐 2 克、糖 3 克（可选）","tools":"炒锅、锅铲、碗、菜刀、砧板","steps":["番茄洗净切块；鸡蛋打入碗中，加入 1 克盐并打散。","炒锅中火加热，倒入 10 毫升油，倒入蛋液。待凝固后轻轻推散，盛出。","加入剩余油和番茄，中火翻炒 3–4 分钟，炒出汁水。","倒回鸡蛋，加入剩余盐和糖，翻炒约 1 分钟，确认蛋液完全凝固后出锅。"]},{"id":2,"name":"青椒土豆丝","icon":"🥔","time":15,"desc":"清爽脆口，下饭又简单","ingredients":[["土豆","2 个"],["青椒","1 个"]],"season":"食用油 15 毫升、盐 2 克、米醋 5 毫升","tools":"炒锅、锅铲、菜刀、砧板、滤篮","steps":["土豆去皮切细丝，用清水冲洗去表面淀粉并沥干；青椒去籽切丝。","锅中倒油，中大火加热，放入土豆丝翻炒约 3 分钟。","加入青椒丝和盐，继续翻炒约 2 分钟，至土豆丝熟透。","沿锅边加入米醋，翻炒均匀即可出锅。"]},{"id":3,"name":"西兰花炒鸡胸肉","icon":"🥦","time":20,"desc":"一荤一蔬，轻松做一餐","ingredients":[["西兰花","250 克"],["鸡胸肉","200 克"],["蒜","2 瓣"]],"season":"食用油 15 毫升、生抽 10 毫升、淀粉 3 克、盐 1 克","tools":"炒锅、汤锅、锅铲、碗、菜刀、砧板","steps":["鸡胸肉切薄片，用生抽和淀粉拌匀，腌制 10 分钟。处理生肉后洗手，并清洗刀具和砧板。","西兰花切小朵洗净，放入沸水焯约 2 分钟，捞出沥干；蒜切末。","炒锅中加油，中火炒香蒜末，放入鸡肉片摊开翻炒至熟。","加入西兰花和盐，翻炒均匀。鸡肉中心温度达到 74°C 后再出锅。"]},{"id":4,"name":"黄瓜拌豆腐","icon":"🥒","time":8,"desc":"免开火，清爽的一盘","ingredients":[["黄瓜","1 根"],["即食嫩豆腐","1 盒（300 克）"]],"season":"生抽 10 毫升、米醋 5 毫升、香油 3 毫升","tools":"菜刀、砧板、盘子、小碗","steps":["使用包装标明可直接食用的嫩豆腐，按包装要求冷藏保存并在保质期内食用。沥水切块。","黄瓜洗净切小块；生抽、米醋和香油放入小碗拌匀。","黄瓜与豆腐装盘，淋入料汁，轻拌即可，做好后尽快食用。"]},{"id":5,"name":"番茄鸡蛋面","icon":"🍜","time":15,"desc":"有汤有面，一个人也好好吃饭","ingredients":[["番茄","1 个"],["鸡蛋","1 个"],["面条","100 克"]],"season":"食用油 10 毫升、盐 2 克、水约 600 毫升","tools":"汤锅、锅铲、碗、筷子、菜刀、砧板","steps":["番茄洗净切块，鸡蛋打散。","汤锅中加油，中火炒蛋至凝固，盛出。放入番茄炒出汁水。","加水煮沸，放入面条，按包装标注时间煮熟。","加入鸡蛋和盐，再次煮沸，确认鸡蛋完全熟透后盛出。"]},{"id":6,"name":"蒜蓉生菜","icon":"🥬","time":10,"desc":"好好做饭，慢慢享用","ingredients":[["生菜","300 克"],["蒜","3 瓣"]],"season":"食用油 10 毫升、生抽 5 毫升、盐 1 克","tools":"炒锅、锅铲、菜刀、砧板","steps":["生菜拆叶洗净沥干，蒜切末。","锅中加油，中火炒香蒜末约 20 秒。","加入生菜转大火翻炒约 2 分钟。","加盐和生抽，翻炒至菜叶熟软即可。"]},{"id":7,"name":"清炒西兰花","icon":"🥦","time":12,"desc":"好好做饭，慢慢享用","ingredients":[["西兰花","300 克"],["蒜","2 瓣"]],"season":"食用油 10 毫升、盐 2 克","tools":"汤锅、炒锅、滤篮、锅铲","steps":["西兰花切小朵洗净，蒜切末。","沸水中焯西兰花约 2 分钟，捞出沥干。","锅中加油，中火炒香蒜末。","放入西兰花和盐，翻炒约 2 分钟至熟透。"]},{"id":8,"name":"手撕包菜","icon":"🥬","time":12,"desc":"好好做饭，慢慢享用","ingredients":[["包菜","300 克"],["蒜","2 瓣"]],"season":"食用油 15 毫升、生抽 5 毫升、米醋 5 毫升、盐 1 克","tools":"炒锅、锅铲、菜刀、砧板","steps":["包菜撕成小片，洗净并充分沥干；蒜切片。","锅中加油，中火炒香蒜片。","加入包菜，转大火翻炒 3–4 分钟至断生。","加生抽、盐和米醋，翻炒均匀。"]},{"id":9,"name":"香菇炒青菜","icon":"🥬","time":15,"desc":"好好做饭，慢慢享用","ingredients":[["鲜香菇","150 克"],["小白菜","250 克"],["蒜","2 瓣"]],"season":"食用油 15 毫升、盐 2 克、生抽 5 毫升","tools":"炒锅、菜刀、砧板、锅铲","steps":["香菇洗净切片，小白菜洗净切段，蒜切末。","锅中加油，中火炒香蒜末，放入香菇翻炒 3 分钟。","先加入白菜梗翻炒 1 分钟，再加菜叶。","加盐和生抽，继续炒至香菇和青菜完全熟透。"]},{"id":10,"name":"西葫芦炒蛋","icon":"🥒","time":15,"desc":"好好做饭，慢慢享用","ingredients":[["西葫芦","1 根"],["鸡蛋","2 个"]],"season":"食用油 15 毫升、盐 2 克","tools":"炒锅、锅铲、碗、菜刀、砧板","steps":["西葫芦洗净切薄片，鸡蛋打散。","锅中加一半油，中火炒鸡蛋至凝固，盛出。","加入剩余油和西葫芦，翻炒 3–4 分钟至熟软。","倒回鸡蛋，加盐翻匀，确保蛋液完全凝固。"]},{"id":11,"name":"胡萝卜炒蛋","icon":"🥕","time":15,"desc":"好好做饭，慢慢享用","ingredients":[["胡萝卜","1 根"],["鸡蛋","2 个"]],"season":"食用油 15 毫升、盐 2 克","tools":"炒锅、锅铲、碗、菜刀、砧板","steps":["胡萝卜去皮切细丝，鸡蛋打散。","锅中倒一半油，中火炒蛋至凝固，盛出。","加入剩余油和胡萝卜，淋 20 毫升水，翻炒 4–5 分钟至熟软。","放回鸡蛋，加盐翻炒均匀。"]},{"id":12,"name":"洋葱炒牛肉","icon":"🥩","time":25,"desc":"好好做饭，慢慢享用","ingredients":[["洋葱","1 个"],["牛肉","200 克"]],"season":"生抽 10 毫升、淀粉 3 克、食用油 15 毫升、盐 1 克","tools":"炒锅、碗、菜刀、砧板、锅铲","steps":["牛肉逆纹切薄片，加生抽和淀粉腌 10 分钟；洋葱切丝。","处理生肉后洗手并清洁刀具砧板。锅中加油，中大火将牛肉炒至熟，盛出。","用锅中余油炒洋葱 3–4 分钟至变软。","倒回牛肉，加盐翻炒均匀，确保肉片熟透。"]},{"id":13,"name":"青椒炒肉丝","icon":"🫑","time":25,"desc":"好好做饭，慢慢享用","ingredients":[["青椒","2 个"],["猪里脊","200 克"]],"season":"生抽 10 毫升、淀粉 3 克、食用油 15 毫升、盐 1 克","tools":"炒锅、碗、菜刀、砧板、锅铲","steps":["猪里脊切细丝，加生抽和淀粉腌 10 分钟。","青椒去籽切丝；处理生肉后清洁双手和刀板。","锅中加油，中大火炒肉丝至熟，加入青椒。","继续翻炒 3–4 分钟，加盐调味，确认猪肉熟透。"]},{"id":14,"name":"芹菜炒肉","icon":"🥬","time":25,"desc":"好好做饭，慢慢享用","ingredients":[["芹菜","250 克"],["猪里脊","150 克"]],"season":"生抽 10 毫升、淀粉 3 克、食用油 15 毫升、盐 1 克","tools":"炒锅、碗、菜刀、砧板、锅铲","steps":["猪肉切丝，加生抽和淀粉腌 10 分钟。","芹菜去根洗净切段；清洁处理生肉的双手和工具。","热锅加油，中大火炒肉丝至熟。","加入芹菜炒约 3 分钟，加盐，炒至芹菜及猪肉熟透。"]},{"id":15,"name":"虾仁炒蛋","icon":"🍤","time":15,"desc":"好好做饭，慢慢享用","ingredients":[["虾仁","150 克"],["鸡蛋","3 个"]],"season":"食用油 15 毫升、盐 2 克","tools":"炒锅、碗、锅铲","steps":["虾仁去虾线洗净沥干，鸡蛋加盐打散。","锅中加油，中火炒虾仁 2–3 分钟至肉质不透明。","倒入蛋液，稍等底部凝固后轻轻推炒。","炒至鸡蛋完全凝固、虾仁完全熟透即可出锅。"]},{"id":16,"name":"玉米炒虾仁","icon":"🌽","time":15,"desc":"好好做饭，慢慢享用","ingredients":[["玉米粒","150 克"],["虾仁","150 克"],["胡萝卜","半根"]],"season":"食用油 15 毫升、盐 2 克","tools":"炒锅、汤锅、滤篮、菜刀、砧板","steps":["胡萝卜去皮切小丁，虾仁去虾线洗净。","玉米粒和胡萝卜丁放入沸水煮 3–5 分钟至熟，沥干。","炒锅加油，中火炒虾仁至不透明。","加入玉米、胡萝卜和盐，翻炒 2 分钟，确保虾仁熟透。"]},{"id":17,"name":"香煎鸡胸肉","icon":"🍗","time":30,"desc":"好好做饭，慢慢享用","ingredients":[["鸡胸肉","250 克"]],"season":"生抽 10 毫升、黑胡椒 1 克、食用油 10 毫升","tools":"平底锅、夹子、碗、菜刀、砧板、食品温度计","steps":["鸡胸肉横切成约 1 厘米厚片，用生抽和黑胡椒腌 15 分钟。","清洁双手及处理生肉的工具。平底锅加油，中火加热。","放入鸡肉，每面煎约 3–5 分钟，根据厚度调整火力和时间。","测量最厚处中心达到 74°C，静置 2 分钟后切块。"]},{"id":18,"name":"土豆炖鸡","icon":"🥔","time":45,"desc":"好好做饭，慢慢享用","ingredients":[["鸡腿肉","300 克"],["土豆","2 个"],["姜","3 片"]],"season":"食用油 10 毫升、生抽 15 毫升、盐 2 克、水 500 毫升","tools":"炖锅、锅铲、菜刀、砧板、食品温度计","steps":["鸡腿肉切块；土豆去皮切块。处理生肉后清洁双手及工具。","炖锅加油，中火炒香姜片，加入鸡肉翻炒至表面变色。","加生抽和水，煮沸后盖盖小火炖 15 分钟。","加入土豆炖约 15 分钟至软，加盐。鸡肉最厚处中心达到 74°C 后出锅。"]},{"id":19,"name":"番茄豆腐汤","icon":"🍲","time":15,"desc":"好好做饭，慢慢享用","ingredients":[["番茄","2 个"],["嫩豆腐","300 克"]],"season":"食用油 10 毫升、盐 2 克、水 600 毫升","tools":"汤锅、汤勺、菜刀、砧板","steps":["番茄洗净切块，豆腐切块。","锅中加油，中火炒番茄 3 分钟至出汁。","加入水煮沸，轻放豆腐，转小火煮约 5 分钟。","加盐调味，再次煮沸即可。"]},{"id":20,"name":"紫菜蛋花汤","icon":"🍲","time":10,"desc":"好好做饭，慢慢享用","ingredients":[["紫菜","5 克"],["鸡蛋","1 个"]],"season":"盐 2 克、香油 2 毫升、水 600 毫升","tools":"汤锅、碗、筷子、汤勺","steps":["鸡蛋在碗中打散，紫菜按包装说明处理。","锅中加水煮沸，放入紫菜煮 1 分钟。","保持汤沸腾，缓慢淋入蛋液，待凝固后轻推。","加盐和香油，确保鸡蛋完全熟透后关火。"]},{"id":21,"name":"冬瓜虾仁汤","icon":"🍲","time":20,"desc":"好好做饭，慢慢享用","ingredients":[["冬瓜","300 克"],["虾仁","150 克"],["姜","2 片"]],"season":"食用油 5 毫升、盐 2 克、水 700 毫升","tools":"汤锅、汤勺、菜刀、砧板","steps":["冬瓜去皮去籽切薄片，虾仁去虾线洗净。","汤锅加油，中火炒香姜片，加水煮沸。","加入冬瓜，小火煮约 8 分钟至透明变软。","加入虾仁再煮 3–4 分钟至完全熟透，加盐。"]},{"id":22,"name":"南瓜小米粥","icon":"🥣","time":35,"desc":"好好做饭，慢慢享用","ingredients":[["南瓜","200 克 const authorDialog=document.createElement('dialog');authorDialog.id='author-dialog';authorDialog.setAttribute('aria-labelledby','author-title');authorDialog.innerHTML='<div class="eyebrow">cookyou · 作者彩蛋</div><h2 id="author-title">gzh</h2><p class="author-credit">厨师介绍</p><p class="author-message">金字塔的尖，方程式的解，禁忌的答案，沉默的裁决者，最后的至高容器，被世界遗忘的观测者，天罚的代行者，行走的禁忌，命运的bug，终焉的具象，大审判的号角，斩断因果的刃</p><button class="primary full" id="author-close">收下这份隐藏菜谱 ♡</button>';root.querySelector('.kitchen').append(authorDialog);authorDialog.querySelector('button').onclick=()=>authorDialog.close();function showAuthor(){if(!authorDialog.open)authorDialog.showModal();}function persist(){try{localStorage.setItem("cookyou-state",JSON.stringify(s));}catch{}window.openai?.setWidgetState({modelContent:{所选食材:s.foods,当前页面:s.page,收藏菜谱:recipes.filter(r=>s.saved.includes(r.id)).map(r=>r.name)},privateContent:s})?.catch(()=>{});}
function missing(r){return r.ingredients.filter(i=>!s.foods.includes(i[0])).map(i=>i[0]);}
function card(r,match=false){const m=missing(r);return `<button class="recipe" data-recipe="${r.id}"><span class="dish">${r.icon}</span><span><h3>${r.name}</h3><span class="muted">${r.time} 分钟 · 简单 · 约 2 人份</span><small>${match?(m.length?'还缺：'+m.join('、'):'✓ 主食材齐全'):r.desc}</small></span></button>`;}
function render(){root.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===s.page));if(current){detail();return;}if(s.page==='pantry'){out.innerHTML=`<div class="eyebrow">把现有的，变成好吃的</div><h1>今天冰箱里<br>有什么？</h1><p>添几样食材，看看今晚能做什么。</p><form class="entry" id="add-form"><input aria-label="输入食材" id="food-input" maxlength="80" placeholder="输入食材，如番茄、鸡蛋" autocomplete="off"><button class="primary">添加</button></form><div class="row">${s.foods.map(f=>`<button class="chip" data-remove="${esc(f)}" aria-label="移除${esc(f)}">${esc(f)} ×</button>`).join('')}</div><h2>常见食材</h2><div class="row">${['番茄','鸡蛋','土豆','青椒','西兰花','鸡胸肉','蒜','黄瓜','即食嫩豆腐','面条'].filter(f=>!s.foods.includes(f)).map(f=>`<button class="chip" data-add="${f}">＋ ${f}</button>`).join('')}</div><button class="primary full" id="match">用这些食材找菜 →</button><div id="matches" aria-live="polite">${s.results?results():''}</div>`;
}else if(s.page==='search'){out.innerHTML=`<div class="eyebrow">家常味，慢慢学</div><h1>想吃什么？</h1><p>搜菜名，食材和做法一起找到。</p><form class="entry" id="search-form"><input id="search-input" aria-label="搜索菜名" value="${esc(s.query)}" placeholder="试试：番茄炒蛋"><button class="primary">搜索</button></form><div id="search-results" aria-live="polite">${searchResults()}</div>`;}else{out.innerHTML=`<div class="eyebrow">留住喜欢的味道</div><h1>我的收藏</h1><p>下次想吃，不用再找。</p>${s.saved.length?recipes.filter(r=>s.saved.includes(r.id)).map(r=>card(r)).join(''):'<div class="notice">还没有收藏。打开一道菜，点击“收藏菜谱”。</div>'}`;}bind();}
function results(){if(!s.foods.length)return '<p role="alert">请先添加至少一种食材。</p>';const list=recipes.filter(r=>r.ingredients.some(i=>s.foods.includes(i[0]))&&(!s.only||!missing(r).length)).sort((a,b)=>missing(a).length-missing(b).length);return `<h2>为你找到 ${list.length} 道菜</h2><label><input id="only" type="checkbox" ${s.only?'checked':''}>只看主食材齐全的菜</label><p class="muted">基础油盐等调料单独列出，请在开做前确认。</p>${list.map(r=>card(r,true)).join('')||'<div class="notice">暂时没有匹配的精选菜谱。试试添加其他食材，或取消“只看主食材齐全”。</div>'}`;}
function searchResults(){const a=recipes.filter(r=>r.name.includes(s.query.trim()));return `<h2>${s.query?'搜索结果':'精选家常菜'}</h2>${a.map(r=>card(r)).join('')||'<div class="notice">暂未收录这道菜，试试“番茄”或“土豆”。</div>'}`;}
function detail(){const r=current;out.innerHTML=`<button class="back" id="back">← 返回</button><div class="hero"><div class="food">${r.icon}</div><h1>${r.name}</h1><p>${r.time} 分钟 · 简单 · 2 人份</p></div>${s.page==='cooking'?`<div class="row"><h2>第 ${step+1} / ${r.steps.length} 步</h2></div><progress value="${step+1}" max="${r.steps.length}" aria-label="烹饪进度"></progress><div class="step"><p>${r.steps[step]}</p></div><div class="row"><button id="prev" ${step===0?'disabled':''}>上一步</button><button class="primary" id="next">${step===r.steps.length-1?'完成，开饭！':'下一步 →'}</button></div>`:`<p>${r.desc}</p><button id="save">${s.saved.includes(r.id)?'♥ 已收藏':'♡ 收藏菜谱'}</button><h2>主食材</h2>${r.ingredients.map(i=>`<div class="ingredient"><span>${i[0]} ${s.foods.includes(i[0])?'✓':''}</span><span>${i[1]}</span></div>`).join('')}<h2>调料</h2><p>${r.season}</p><h2>需要的厨具</h2><p>${r.tools}</p><h2>做法预览</h2>${r.steps.map((v,i)=>`<p>${i+1}. ${v}</p>`).join('')}<button class="primary full" id="cook">开始做菜 →</button>`}`;bind();}
function bind(){out.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{s.foods=[...new Set([...s.foods,b.dataset.add])];render();persist();});out.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{s.foods=s.foods.filter(f=>f!==b.dataset.remove);render();persist();});out.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{origin=s.page;current=recipes.find(r=>r.id===+b.dataset.recipe);detail();});const on=(id,event,fn)=>{const e=out.querySelector('#'+id);if(e)e[event]=fn;};on('add-form','onsubmit',e=>{e.preventDefault();const input=out.querySelector('#food-input');if(input.value.trim()==='gzh'){input.value='';showAuthor();return;}const a=input.value.split(/[，,、\s]+/).filter(Boolean);s.foods=[...new Set([...s.foods,...a.map(f=>f==='西红柿'?'番茄':f==='马铃薯'?'土豆':f)])].slice(0,40);render();persist();});on('match','onclick',()=>{s.results=true;render();persist();});on('only','onchange',e=>{s.only=e.target.checked;render();persist();});on('search-form','onsubmit',e=>{e.preventDefault();s.query=out.querySelector('#search-input').value;if(s.query.trim()==='gzh'){showAuthor();return;}render();persist();});on('back','onclick',()=>{if(s.page==='cooking'){s.page=origin;detail();}else{current=null;render();}persist();});on('save','onclick',()=>{s.saved=s.saved.includes(current.id)?s.saved.filter(id=>id!==current.id):[...s.saved,current.id];detail();persist();});on('cook','onclick',()=>{s.page='cooking';step=0;detail();});on('prev','onclick',()=>{step--;detail();});on('next','onclick',()=>{if(step<current.steps.length-1){step++;detail();}else{s.page=origin;step=0;detail();out.insertAdjacentHTML('afterbegin','<div class="notice" role="status">做好啦，慢慢享用 ♡</div>');persist();}});}
root.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{s.page=b.dataset.page;current=null;render();persist();});window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v){s={...s,...v};current=null;render();}});render();
window.cookyouBack=()=>{if(authorDialog.open){authorDialog.close();return true;}if(current){if(s.page==='cooking'){s.page=origin;detail();}else{current=null;render();}return true;}if(s.page!=='pantry'){s.page='pantry';render();persist();return true;}return false;};if(globalThis.Tweak){const design={rounded:30};const t=new Tweak({container:root.querySelector('.kitchen'),onChange:()=>root.querySelector('.kitchen').style.borderRadius=design.rounded+'px'});t.addSlider(design,'rounded',{label:'手机外框圆角',min:12,max:40,unit:'px'});}
})();
</script>
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fbf8f1}#pantry-demo{padding:0;color-scheme:light}#pantry-demo .kitchen{--paper:#fbf8f1;--ink:#343e32;--sub:#7a7d6e;--wash:#eeeee2;--line:#e6e4d8;--brand:#657b5c;--onbrand:#fffdf6;max-width:680px;min-height:100dvh;border:0;border-radius:0;box-shadow:none;padding-bottom:86px}#pantry-demo header{padding-top:28px}#pantry-demo header span:first-child{font-family:Georgia,serif;font-size:26px;font-style:italic;letter-spacing:-1px;color:#657b5c}#pantry-demo header span:last-child{font-size:10px;letter-spacing:0}#pantry-demo main{padding-top:8px;min-height:0}#pantry-demo h1{font-weight:400;letter-spacing:1px}#pantry-demo .recipe{background:#fffdf8;border-color:#ece7dc;border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 4px 16px #76685006}#pantry-demo .dish{width:76px;height:82px;border-radius:40px 40px 18px 18px;background:#eee9dc}#pantry-demo .recipe:nth-of-type(3n) .dish{background:#e4ebdf}#pantry-demo .recipe:nth-of-type(3n + 1) .dish{background:#f4e6da}#pantry-demo .primary{border-radius:18px}#pantry-demo .hero{background:#eee9dc;border-radius:48px 48px 22px 22px}#pantry-demo nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;background:#fbf8f1;padding-bottom:max(15px,env(safe-area-inset-bottom));z-index:5}#pantry-demo button:active{transform:scale(.98)}#pantry-demo input:focus-visible,#pantry-demo button:focus-visible{outline:2px solid #657b5c;outline-offset:2px}#pantry-demo .step{min-height:160px}#pantry-demo .recipe h3{font-size:17px}#pantry-demo .eyebrow{letter-spacing:3px;font-size:11px}@media(min-width:600px){#pantry-demo main{padding-left:40px;padding-right:40px}}</style><style>#pantry-demo #author-dialog{width:calc(100% - 40px);max-width:370px;max-height:85dvh;overflow:auto;padding:26px;border:1px solid #e6e4d8;border-radius:26px;background:#fbf8f1;color:#343e32;box-shadow:0 20px 80px #242e2940}#pantry-demo #author-dialog::backdrop{background:#25332a65}#pantry-demo #author-dialog h2{font-size:28px;margin:14px 0 8px}#pantry-demo #author-dialog .author-message{line-height:2.1;color:#4c5947}#pantry-demo #author-dialog .author-credit{font-size:13px;color:#7a7d6e}</style></body></html>
